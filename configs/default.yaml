# Default Configuration for ILS-HED
# Used when no specific dataset config is provided

# Global settings
seed: 42
device: "cuda"  # or "cpu"
verbose: true

# ILS Hyper-parameters (Section 4.4)
ils:
  max_iterations: 50
  patience: 10
  fusion_epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.0002
  batch_size: 1
  
  # Perturbation operator probabilities (Section 3.4)
  perturbation:
    add: 0.33
    remove: 0.33
    swap: 0.34

# Detector search space (Section 3.1)
detectors:
  canny:
    thresholds: [[30, 90], [50, 150], [75, 225]]
    apertures: [3, 5, 7]
  
  sobel:
    kernels: [3, 5, 7, 9]
  
  laplacian:
    kernels: [3, 5, 7, 9]
  
  gabor:
    orientations: [4, 8, 12]
    wavelengths: [4, 8, 16]
    bandwidths: [0.5, 1.0, 2.0]
    kernel_size: 31

# Fusion module (Section 3.5)
fusion:
  n_hed_outputs: 5
  fusion_type: "learnable"  # or "average"
  activation: "sigmoid"

# Post-processing (Section 3.3.4)
postprocessing:
  nms_enabled: true
  thinning_method: "morphological"  # or "nms"
  threshold: 0.5

# Logging and checkpoints
logging:
  log_dir: "./logs"
  checkpoint_dir: "./checkpoints"
  result_dir: "./results"
  save_frequency: 5  # save every N iterations

# Statistical testing (Section 4.2)
statistics:
  n_bootstrap: 10000
  confidence_level: 0.95
  significance_level: 0.05