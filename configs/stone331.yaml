# Stone331 Stone Crack Detection Dataset
# Section 4.1: Stone331 (Zhang et al., 2023)
# 331 images: 265 train, 33 val, 33 test

dataset:
  name: "Stone331"
  root_dir: "./data/Stone331"
  image_size: [400, 400]
  num_classes: 2

splits:
  train:
    images: 265
  val:
    images: 33
  test:
    images: 33

ils:
  max_iterations: 50
  patience: 10
  fusion_epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.0002

detectors:
  canny:
    enabled: true
    thresholds: [[30, 90], [50, 150], [75, 225]]
    apertures: [3, 5, 7]
  sobel:
    enabled: true
    kernels: [3, 5, 7, 9]
  laplacian:
    enabled: true
    kernels: [3, 5, 7, 9]
  gabor:
    enabled: true
    orientations: [4, 8, 12]
    wavelengths: [4, 8, 16]
    bandwidths: [0.5, 1.0, 2.0]

# Expected results (Table 15)
expected_results:
  hed_baseline:
    f1: 0.6720
    precision: 0.6780
    recall: 0.6660
    iou: 0.5070
  ils_hed:
    f1: 0.6980
    precision: 0.7040
    recall: 0.6920
    iou: 0.5360