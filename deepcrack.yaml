# DeepCrack Crack Detection Dataset
# Section 4.1: DeepCrack (Liu et al., 2019)
# 300 images: 240 train, 30 val, 30 test

dataset:
  name: "DeepCrack"
  root_dir: "./data/DeepCrack"
  image_size: [400, 400]
  num_classes: 2

splits:
  train:
    images: 240
  val:
    images: 30
  test:
    images: 30

ils:
  max_iterations: 50
  patience: 10
  fusion_epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.0002

detectors:
  canny:
    enabled: true
    thresholds: [[30, 90], [50, 150], [75, 225]]
    apertures: [3, 5, 7]
  sobel:
    enabled: true
    kernels: [3, 5, 7, 9]
  laplacian:
    enabled: true
    kernels: [3, 5, 7, 9]
  gabor:
    enabled: true
    orientations: [4, 8, 12]
    wavelengths: [4, 8, 16]
    bandwidths: [0.5, 1.0, 2.0]

# Expected results (Table 14)
expected_results:
  hed_baseline:
    f1: 0.6850
    precision: 0.6910
    recall: 0.6790
    iou: 0.5210
  ils_hed:
    f1: 0.7120
    precision: 0.7180
    recall: 0.7060
    iou: 0.5530